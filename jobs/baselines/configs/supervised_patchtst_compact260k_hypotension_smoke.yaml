# GPU smoke test for the parameter-matched supervised PatchTST.

run_config:
  model_type: "supervised_patchtst"
  wandb_project: "Hypotension Supervised Baselines"
  model_run: "compact260k-smoke-v1"
  name: "supervised_patchtst_compact260k_hypotension_smoke"
  random_state: 16
  precision: "32-true"
  deterministic: true
  wandb_offline: true

resume:
  enabled: true
  run_subdir: "2026-08-02-supervised_patchtst-compact260k-smoke-v1"
  checkpoint_interval_minutes: 30

paths:
  data_dir: "/gpfs/data/eh3828lab/derived_datasets/baselines/PhysioJEPA/containers"
  models_dir: "/gpfs/data/eh3828lab/derived_datasets/baselines/PhysioJEPA/models/supervised_patchtst_compact260k_hypotension_smoke"
  sample_cache_dir: "/gpfs/data/eh3828lab/derived_datasets/baselines/PhysioJEPA/models/fcn_hypotension_subset10"
  outcome_df_path: "/gpfs/data/eh3828lab/derived_datasets/baselines/PhysioJEPA/labels/hypotension_labels_mimic_all_events_rolling5min.csv.gz"
  subject_split_path: "/gpfs/data/eh3828lab/derived_datasets/baselines/PhysioJEPA/manifests/hypotension_subject_split_fixed_subset10_v1.csv"
  dataset_filename: "zipstore_ABP_II_PLETH_125Hz_1800sec_hypotension_fixed_subject_split_subset10_v1"

dataset:
  channels: ["ABP", "II", "PLETH"]
  frequency: 125
  forecast_window_sec: [300]
  sample_seq_len_seconds: 1800
  win_length: 125
  overlap: 0.0
  constant_nan_tolerance: 0.2
  y_padding_mask: -100
  y_outcome: "hypotension_label"
  require_all_channels: true
  normalize_signals: true
  use_transforms: false
  infer_forecast_windows: false

arch:
  c_in: 3
  patch_size: 125
  patch_stride: 125
  num_patches: 1800
  d_model: 96
  n_heads: 4
  d_ff: 384
  num_layers: 2
  augmentations: []
  mask_ratio: 0.0
  shared_embedding: false
  dropout: 0.1
  attn_dropout: 0.0
  act: "gelu"
  pre_norm: false
  pe_type: "rotary"
  qkv_bias: true
  init_std: 0.02
  tokenizer_type: "simple"
  tokenizer_kwargs: {}
  classifier_type: "mean"
  num_classes: 1

training:
  # Exercise the intended full-run batch size in the memory smoke test.
  batch_size: 16
  epochs: 1
  n_gpus: 1
  num_workers: 4
  sample_generation_workers: 4
  require_precomputed_samples: true
  limit_train_batches: 5
  limit_val_batches: 2
  limit_predict_batches: 2
  accumulate_grad_batches: 1
  val_check_interval: 1.0
  gradient_clip_val: 1.0
  use_gradient_clipping: true
  loss_fxn: "CrossEntropy"
  fine_tune: true
  label_smoothing: 0.0
  gamma: 2.0
  perform_cv: false
  mixup: false
  mixup_alpha: 0.2
  use_class_weights: true

optimizer:
  learning_rate: 0.000004
  weight_decay: 0.001
  use_weight_decay_scheduler: false
  final_weight_decay: 0.001
  optimizer_type: "adamw"

scheduler:
  scheduler_type: "OneCycle"
  max_lr: 0.0001
  div_factor: 25
  final_div_factor: 100
  pct_start: 0.3
  anneal_strategy: "cos"

cohort_validation:
  strict_cohort_match: true
  expected_cohort:
    train:
      positive_events: 4363
      negative_events: 98072
      icu_stays: 321
      patients: 201
    val:
      positive_events: 560
      negative_events: 12450
      icu_stays: 40
      patients: 26
    test:
      positive_events: 557
      negative_events: 12418
      icu_stays: 41
      patients: 26

evaluation:
  paper_metrics: false
