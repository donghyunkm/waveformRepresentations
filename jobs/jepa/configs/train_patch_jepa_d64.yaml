# Native PhysioJEPA pretraining with reduced d_model=64 (compression experiment).

run_config:
  model_type: "native_jepa"
  wandb_project: "Bedside Hypotension JEPA"
  model_run: "paper-d64-v1"
  name: "native_jepa_ABP_II_PLETH_d64_v1"
  random_state: 12
  precision: "bf16-mixed"
  deterministic: true
  wandb_offline: true

resume:
  enabled: true
  run_subdir: "2026-08-12-native-jepa-d64-v1"
  checkpoint_interval_minutes: 30

paths:
  containers_dir: "/gpfs/data/eh3828lab/derived_datasets/baselines/PhysioJEPA/containers"
  waveform_manifest_path: "/gpfs/data/eh3828lab/derived_datasets/baselines/PhysioJEPA/manifests/waveform_manifest.csv"
  downstream_subject_split_path: "/gpfs/data/eh3828lab/derived_datasets/baselines/PhysioJEPA/manifests/hypotension_subject_split_fixed_v1.csv"
  pretraining_manifest_path: "/gpfs/data/eh3828lab/derived_datasets/baselines/PhysioJEPA/manifests/jepa_native_paper_leakage_safe_v1.csv"
  sample_cache_dir: "/gpfs/data/eh3828lab/derived_datasets/baselines/PhysioJEPA/sample_indices/jepa_native_paper_leakage_safe_v1"
  models_dir: "/gpfs/data/eh3828lab/derived_datasets/baselines/PhysioJEPA/models/jepa_native_d64"
  dataset_filename: "zipstore_ABP_II_PLETH_125Hz_1800sec_stride1800_jepa_leakage_safe_v1"

split:
  exclude_downstream_splits: ["val", "test"]
  validation_fraction: 0.05

sample_preparation:
  workers: 16

dataset:
  channels: ["ABP", "II", "PLETH"]
  frequency: 125
  patch_seconds: 1
  overlap: 0.0
  sample_seq_len_seconds: 1800
  sample_stride_seconds: 1800
  constant_nan_tolerance: 0.2
  normalize_signals: true
  require_all_channels: true

encoder:
  d_model: 64
  nhead: 4
  num_layers: 3
  pe_type: "rotary"
  mlp_ratio: 4.0
  use_tst_block: true
  shared_embedding: false
  qkv_bias: true
  qk_scale: null
  drop_rate: 0.1
  attn_drop_rate: 0.0
  jepa: true
  tokenizer_type: "simple"
  tokenizer_kwargs:
    depth: 1
    bottleneck_channels: 112
    residual: true
    kernel_size: 40
    bottleneck: true

predictor:
  predictor_embed_dim: 32
  nhead: 2
  num_layers: 2
  use_tst_block: true
  pe_type: "rotary"
  mlp_ratio: 4.0
  qkv_bias: true
  qk_scale: null
  drop_rate: 0.1
  attn_drop_rate: 0.0
  c_in_mask_tokens: 3

training:
  n_gpus: 1
  batch_size: 256
  epochs: 100
  num_workers: 8
  accumulate_grad_batches: 1
  huber_delta: 1
  target_mask_range: [0.1, 0.3]
  context_mask_range: [0.1, 0.4]
  mask_block_range: [1, 1]
  ema_decay: 0.996
  val_check_interval: 1.0
  use_gradient_clipping: true
  gradient_clip_val: 1.0
  gradient_clip_algorithm: "norm"
  loss_fxn: "mse"
  log_every_n_steps: 10
  num_sanity_val_steps: 2

optimizer:
  learning_rate: 0.00001
  weight_decay: 0.04
  use_weight_decay_scheduler: true
  final_weight_decay: 0.4
  optimizer_type: "adamw"

scheduler:
  scheduler_type: "onecycle"
  max_lr: 0.0006
  div_factor: 25
  final_div_factor: 100
  pct_start: 0.3
  anneal_strategy: "cos"
