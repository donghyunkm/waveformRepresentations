# Cluster-ready self-supervised PatchTST pretraining (paper architecture).
# Mirrors the original train_patchtst.yaml architecture with cluster adaptations:
# - ZipStore containers instead of directory Zarr stores
# - Leakage-safe pretraining manifest (same as native JEPA)
# - Offline W&B logging
# - Checkpoint resume support

run_config:
  model_type: "TST"
  wandb_project: "Bedside PatchTST Self Supervised Training"
  model_run: "paper-full-cluster-v1"
  name: "PatchTST_paper_full_cluster_v1"
  random_state: 12
  precision: "bf16-mixed"
  wandb_offline: true

resume:
  enabled: true
  run_subdir: "2026-08-05-patchtst-paper-full-cluster-v1"
  checkpoint_interval_minutes: 30

paths:
  containers_dir: "/gpfs/data/eh3828lab/derived_datasets/baselines/PhysioJEPA/containers"
  waveform_manifest_path: "/gpfs/data/eh3828lab/derived_datasets/baselines/PhysioJEPA/manifests/waveform_manifest.csv"
  downstream_subject_split_path: "/gpfs/data/eh3828lab/derived_datasets/baselines/PhysioJEPA/manifests/hypotension_subject_split_fixed_v1.csv"
  pretraining_manifest_path: "/gpfs/data/eh3828lab/derived_datasets/baselines/PhysioJEPA/manifests/jepa_native_paper_leakage_safe_v1.csv"
  sample_cache_dir: "/gpfs/data/eh3828lab/derived_datasets/baselines/PhysioJEPA/sample_indices/jepa_native_paper_leakage_safe_v1"
  models_dir: "/gpfs/data/eh3828lab/derived_datasets/baselines/PhysioJEPA/models/patchtst_self_supervised_paper"
  dataset_filename: "zipstore_ABP_II_PLETH_125Hz_1800sec_stride1800_jepa_leakage_safe_v1"

split:
  exclude_downstream_splits: ["val", "test"]
  validation_fraction: 0.05

# Dataset Configuration (identical to paper and original train_patchtst.yaml)
dataset:
  channels: ["ABP", "II", "PLETH"]
  frequency: 125
  patch_seconds: 1
  overlap: 0.0
  sample_seq_len_seconds: 1800
  sample_stride_seconds: 1800
  constant_nan_tolerance: 0.2
  normalize_signals: true
  require_all_channels: true

# Model Architecture (identical to paper: same as PhysioJEPA context encoder)
encoder:
  d_model: 512
  n_heads: 8
  d_ff: 2048
  num_layers: 3
  augmentations: ["patch_mask"]
  mask_ratio: [0.1, 0.3]
  shared_embedding: false
  pretrain_head: true
  dropout: 0.1
  attn_dropout: 0.0
  act: "gelu"
  pre_norm: false
  pe_type: "rotary"
  qkv_bias: true
  init_std: 0.02
  tokenizer_type: "simple"
  tokenizer_kwargs:
    depth: 1
    bottleneck_channels: 112
    residual: true
    kernel_size: 40
    bottleneck: true

# Training Configuration
training:
  n_gpus: 2
  batch_size: 32
  epochs: 100
  num_workers: 14
  accumulate_grad_batches: 1
  huber_delta: 1
  val_check_interval: 1.0
  use_gradient_clipping: true
  gradient_clip_val: 1.0
  gradient_clip_algorithm: "norm"
  loss_fxn: "mse"
  log_every_n_steps: 10
  num_sanity_val_steps: 2

# Optimizer Configuration
optimizer:
  learning_rate: 0.00001
  weight_decay: 0.04
  use_weight_decay_scheduler: true
  final_weight_decay: 0.4
  optimizer_type: "adamw"

# OneCycle Scheduler Parameters
scheduler:
  scheduler_type: "onecycle"
  max_lr: 0.0006
  div_factor: 25
  final_div_factor: 100
  pct_start: 0.3
  anneal_strategy: "cos"
